<style>
/* ============================================================
   VITALINK DZ — نظام التصميم
   الأبيض + البنفسجي | Modern Minimal Premium
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --white: #FFFFFF;
  --purple: #6C4EFF;
  --purple-600: #5A3FE8;
  --purple-100: #F0EDFF;
  --purple-050: #F7F5FF;
  --ink: #171726;
  --ink-2: #3B3B54;
  --muted: #8A8AA3;
  --line: #ECEAF4;
  --green: #22C55E;
  --green-100: #E7F9EF;
  --orange: #F59E0B;
  --orange-100: #FEF3E2;
  --red: #EF4444;
  --red-100: #FDE8E8;
  --blue: #3B82F6;
  --blue-100: #E8F1FE;
  --radius-lg: 28px;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 20px 50px rgba(23, 23, 38, .08);
  --shadow-sm: 0 6px 20px rgba(23, 23, 38, .06);
  --font: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif;
  --topbar-h: 70px;
}
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: #F8F7FC;
  color: var(--ink);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4,h5 { font-weight: 700; line-height: 1.35; }
button { font-family: var(--font); cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: var(--font); }
a { color: var(--purple); text-decoration: none; }
img { max-width: 100%; }

/* ===== أزرار ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 22px; border-radius: var(--radius-sm); font-weight: 600; font-size: 15px;
  transition: .22s ease; white-space: nowrap; user-select: none;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--purple); color: #fff; box-shadow: 0 10px 24px rgba(108,78,255,.32); }
.btn-primary:hover { background: var(--purple-600); transform: translateY(-1px); }
.btn-soft { background: var(--purple-100); color: var(--purple-600); }
.btn-soft:hover { background: #E3DEFF; }
.btn-white { background: #fff; color: var(--purple-600); }
.btn-line { border: 1.6px solid var(--line); color: var(--ink-2); background: #fff; }
.btn-line:hover { border-color: var(--purple); color: var(--purple); }
.btn-ghost { color: var(--muted); }
.btn-ghost:hover { color: var(--purple); background: var(--purple-050); }
.btn-danger { background: var(--red); color: #fff; box-shadow: 0 10px 22px rgba(239,68,68,.28); }
.btn-success { background: var(--green); color: #fff; }
.btn-sm { padding: 9px 15px; font-size: 13px; border-radius: 12px; }
.btn-lg { padding: 16px 30px; font-size: 17px; border-radius: 18px; }
.btn-block { width: 100%; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 14px; display: inline-grid; place-items: center;
  font-size: 18px; color: var(--ink-2); position: relative; transition: .2s ease;
}
.icon-btn:hover { background: var(--purple-050); }

/* ===== نماذج ===== */
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.form-control {
  width: 100%; padding: 12px 14px; border: 1.6px solid var(--line); border-radius: 13px;
  font-size: 15px; color: var(--ink); background: #fff; transition: .2s ease; outline: none;
}
.form-control:focus { border-color: var(--purple); box-shadow: 0 0 0 4px rgba(108,78,255,.12); }
textarea.form-control { resize: vertical; min-height: 84px; }
select.form-control { appearance: auto; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.field-error { font-size: 12px; color: var(--red); margin-top: 5px; }
.field-ok { font-size: 12px; color: var(--green); margin-top: 5px; }

/* ===== حاويات ===== */
.container { width: min(1360px, 96vw); margin: 0 auto; }
.page { padding: 24px 0 90px; }
.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2,1fr); } .grid-3 { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 640px) { .grid-4,.grid-3,.grid-2 { grid-template-columns: 1fr; } }

/* ===== بطاقات ===== */
.card {
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; box-shadow: var(--shadow-sm);
}
.card-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.card-title .ico { width: 34px; height: 34px; border-radius: 11px; background: var(--purple-100); display: grid; place-items: center; font-size: 16px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 16px; flex-wrap: wrap; }
.section-head h2 { font-size: 22px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-16 { margin-bottom: 16px; } .mb-24 { margin-bottom: 24px; }
.flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
.flex-wrap { flex-wrap: wrap; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }

/* ===== شارات ===== */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.badge-green { background: var(--green-100); color: #15803D; }
.badge-orange { background: var(--orange-100); color: #B45309; }
.badge-red { background: var(--red-100); color: #B91C1C; }
.badge-blue { background: var(--blue-100); color: #1D4ED8; }
.badge-purple { background: var(--purple-100); color: var(--purple-600); }
.badge-gray { background: #F0F0F6; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot-green { background: var(--green); } .dot-orange { background: var(--orange); } .dot-red { background: var(--red); } .dot-purple { background: var(--purple); }

/* ===== رأس الصفحة ===== */
.topbar {
  position: sticky; top: 0; z-index: 90; height: var(--topbar-h);
  background: rgba(255,255,255,.85); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner { height: var(--topbar-h); display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 11px; cursor: pointer; }
.brand-logo {
  width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--purple), #9A7BFF); color: #fff; font-size: 22px;
  box-shadow: 0 8px 20px rgba(108,78,255,.35);
}
.brand-text b { font-size: 18px; color: var(--ink); letter-spacing: -.2px; }
.brand-text b span { color: var(--purple); }
.brand-text small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.search-box { flex: 1; max-width: 460px; position: relative; }
.search-box input {
  width: 100%; padding: 12px 44px 12px 16px; border: 1.6px solid var(--line); border-radius: 999px;
  font-size: 14px; background: var(--purple-050); outline: none; transition: .2s ease;
}
.search-box input:focus { border-color: var(--purple); background: #fff; box-shadow: 0 0 0 4px rgba(108,78,255,.1); }
.search-box .s-ico { position: absolute; inset-inline-start: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-results {
  position: absolute; top: calc(100% + 8px); inset-inline: 0; background: #fff; border-radius: 16px;
  box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; z-index: 60; display: none;
}
.search-results.open { display: block; }
.sr-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; transition: .15s ease; }
.sr-item:hover { background: var(--purple-050); }
.sr-item b { font-size: 14px; }
.sr-item .small { font-size: 12px; }
.conn-pill {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
  padding: 7px 14px; border-radius: 999px;
}
.conn-on { background: var(--green-100); color: #15803D; }
.conn-off { background: var(--orange-100); color: #B45309; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; transition: .2s; }
.user-chip:hover { border-color: var(--purple); }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  color: #fff; font-weight: 700; font-size: 16px; flex-shrink: 0;
}
.user-chip .meta { line-height: 1.2; }
.user-chip .meta b { font-size: 13px; display: block; }
.user-chip .meta small { font-size: 11px; color: var(--muted); }
.badge-count {
  position: absolute; top: -3px; inset-inline-end: -3px; min-width: 18px; height: 18px; border-radius: 9px;
  background: var(--red); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 5px;
}

/* ===== القائمة الجانبية ===== */
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.sidebar {
  border-inline-end: 1px solid var(--line); background: var(--white);
  padding: 18px 14px; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow-y: auto;
}
.side-label { font-size: 11px; font-weight: 700; color: var(--muted); padding: 14px 12px 8px; letter-spacing: .4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: start;
  padding: 13px 14px; border-radius: 14px; font-size: 14px; font-weight: 600;
  color: var(--ink-2); transition: .2s ease; margin-bottom: 3px;
}
.nav-item .n-ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--purple-050); font-size: 16px; transition: .2s; }
.nav-item:hover { background: var(--purple-050); color: var(--purple-600); }
.nav-item.active { background: var(--purple); color: #fff; box-shadow: 0 10px 22px rgba(108,78,255,.3); }
.nav-item.active .n-ico { background: rgba(255,255,255,.18); }
.side-card-promo {
  margin-top: 18px; border-radius: 18px; padding: 18px; color: #fff;
  background: linear-gradient(150deg, var(--purple), #8B5CF6);
}
.side-card-promo b { font-size: 14px; }
.side-card-promo p { font-size: 12px; opacity: .85; margin: 6px 0 12px; }

/* ===== المحتوى ===== */
.main { min-width: 0; padding: 24px 26px 60px; }
.view-wrap { animation: viewIn .3s ease; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ===== لوحة الهبوط ===== */
.landing { min-height: 100vh; }
.land-nav { height: var(--topbar-h); display: flex; align-items: center; gap: 14px; }
.land-hero {
  background: linear-gradient(150deg, #1A1A3A 0%, #2A1E5E 45%, var(--purple) 130%);
  color: #fff; border-radius: 34px; padding: 64px 56px; position: relative; overflow: hidden; margin: 16px 0 26px;
}
.land-hero::before { content:''; position:absolute; inset:0; background: radial-gradient(circle at 85% 10%, rgba(255,255,255,.14), transparent 45%); }
.land-hero::after { content:'⚕️'; position:absolute; inset-inline-start:-40px; bottom:-50px; font-size: 260px; opacity:.06; }
.land-hero .pill-tag { display:inline-flex; align-items:center; gap:8px; background: rgba(255,255,255,.14); border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; position:relative; z-index:1; }
.land-hero h1 { font-size: 54px; letter-spacing:-1.5px; margin: 22px 0 6px; position:relative; z-index:1; }
.land-hero h1 span { color: #C9BDFF; }
.land-hero .tagline { font-size: 22px; opacity:.92; position:relative; z-index:1; }
.land-hero p { max-width: 60ch; opacity:.8; margin-top: 14px; font-size: 16px; position:relative; z-index:1; }
.land-hero .cta { margin-top: 30px; display:flex; gap:12px; flex-wrap:wrap; position:relative; z-index:1; }
.land-features { display:grid; grid-template-columns: repeat(4,1fr); gap:18px; margin-bottom: 26px; }
@media (max-width:900px){ .land-features{ grid-template-columns:repeat(2,1fr);} .land-hero h1{font-size:38px;} .land-hero{ padding:44px 28px;} }
@media (max-width:520px){ .land-features{ grid-template-columns:1fr;} }
.lf-card { background:#fff; border:1px solid var(--line); border-radius: var(--radius); padding:22px; transition:.25s ease; }
.lf-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.lf-card .lf-ico { width:54px; height:54px; border-radius:17px; display:grid; place-items:center; font-size:26px; margin-bottom:14px; }
.lf-card b { font-size:16px; display:block; margin-bottom:6px; }
.lf-card p { font-size:13px; color: var(--muted); }

/* ===== شاشة الدخول ===== */
.login-screen { min-height:100vh; display:grid; place-items:center; padding:30px 16px; }
.login-box { width:min(760px, 100%); }
.login-head { text-align:center; margin-bottom:26px; }
.login-head .brand-logo { margin:0 auto 14px; width:64px; height:64px; font-size:30px; border-radius:20px; }
.login-head h1 { font-size:30px; }
.login-head p { color: var(--muted); margin-top:6px; }
.role-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media (max-width:700px){ .role-cards{ grid-template-columns:repeat(2,1fr);} }
@media (max-width:460px){ .role-cards{ grid-template-columns:1fr;} }
.role-card {
  background:#fff; border:1.6px solid var(--line); border-radius:20px; padding:20px; text-align:center; cursor:pointer; transition:.22s ease;
}
.role-card:hover { border-color: var(--purple); transform: translateY(-3px); box-shadow: var(--shadow-sm); }
.role-card .r-ico { width:60px; height:60px; margin:0 auto 12px; border-radius:20px; display:grid; place-items:center; font-size:28px; background: var(--purple-100); }
.role-card b { font-size:15px; display:block; }
.role-card small { color: var(--muted); font-size:12px; }
.role-card .go { margin-top:12px; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color: var(--purple-600); opacity:0; transition:.2s; }
.role-card:hover .go { opacity:1; }

/* ===== الإحصائيات ===== */
.stat-card { display:flex; align-items:center; gap:16px; }
.stat-card .s-ico { width:58px; height:58px; border-radius:18px; display:grid; place-items:center; font-size:26px; flex-shrink:0; }
.stat-card .s-num { font-size:30px; font-weight:700; letter-spacing:-.5px; line-height:1.1; }
.stat-card .s-lab { font-size:13px; color:var(--muted); font-weight:600; }
.bg-purple-soft { background: var(--purple-100); } .bg-green-soft { background: var(--green-100); }
.bg-orange-soft { background: var(--orange-100); } .bg-red-soft { background: var(--red-100); } .bg-blue-soft { background: var(--blue-100); }

/* ===== جدول المرضى ===== */
.table-wrap { overflow-x:auto; }
table.tbl { width:100%; border-collapse:collapse; font-size:14px; }
.tbl th { text-align:start; padding:12px 14px; color:var(--muted); font-weight:600; font-size:12px; border-bottom:2px solid var(--line); white-space:nowrap; }
.tbl td { padding:13px 14px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
.tbl tbody tr { transition:.15s ease; cursor:pointer; }
.tbl tbody tr:hover { background: var(--purple-050); }
.tbl tbody tr.sel { background: var(--purple-100); }
.pat-cell { display:flex; align-items:center; gap:11px; }
.pat-cell b { font-size:14px; display:block; line-height:1.3; }
.pat-cell small { font-size:11px; color:var(--muted); }

/* ===== البطاقة الجانبية الذكية ===== */
.side-panel { position: sticky; top: calc(var(--topbar-h) + 20px); }
.smart-card { background:#fff; border-radius:26px; border:1px solid var(--line); box-shadow: var(--shadow-sm); overflow:hidden; }
.smart-card .sc-head { padding:26px 24px 20px; text-align:center; position:relative; }
.sc-head .avatar { width:86px; height:86px; font-size:34px; margin:0 auto 12px; box-shadow:0 10px 24px rgba(108,78,255,.3); }
.sc-head b { font-size:20px; display:block; }
.sc-head .uid { font-size:12px; color:var(--muted); margin-top:2px; }
.sc-body { padding:0 20px 20px; }
.kv { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px; }
.kv:last-child { border-bottom:none; }
.kv span:first-child { color:var(--muted); }
.kv b { font-weight:600; }
.chip { background:var(--purple-050); color:var(--purple-600); border-radius:999px; padding:3px 11px; font-size:11px; font-weight:600; }
.chip-red { background:var(--red-100); color:#B91C1C; }
.chip-green { background:var(--green-100); color:#15803D; }
.chip-orange { background:var(--orange-100); color:#B45309; }
.chip-blue { background:var(--blue-100); color:#1D4ED8; }
.chip-line { background:#fff; border:1px solid var(--line); color:var(--ink-2); }

/* ===== الأقسام ===== */
.vit-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
@media(max-width:900px){ .vit-grid{ grid-template-columns:repeat(2,1fr);} }
.vit-tile { background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px; text-align:center; transition:.2s; }
.vit-tile:hover { box-shadow: var(--shadow-sm); }
.vit-tile .v-num { font-size:24px; font-weight:700; }
.vit-tile .v-num small { font-size:12px; color:var(--muted); font-weight:600; }
.vit-tile .v-lab { font-size:12px; color:var(--muted); font-weight:600; margin-top:2px; }
.vit-tile.warn { border-color: var(--orange); background: #FFFBF2; }
.vit-tile.crit { border-color: var(--red); background: #FFF7F7; }

/* ===== QR ===== */
.qr { display:grid; gap:1.5px; background:#fff; border-radius:10px; padding:6px; }
.qr b { aspect-ratio:1/1; display:block; }
.qr b.on { background: var(--ink); }
.qr-wrap { display:inline-block; padding:10px; background:#fff; border:1px solid var(--line); border-radius:18px; }

/* ===== بطاقة المتابعة الصحية ===== */
.hc-card {
  width: 360px; border-radius: 24px; overflow:hidden; color:#fff; background: linear-gradient(140deg,#22214A, var(--purple) 70%, #8B5CF6);
  box-shadow: var(--shadow); font-size: 13px; position:relative;
}
.hc-card .hc-top { display:flex; justify-content:space-between; align-items:center; padding:16px 18px 0; }
.hc-card .hc-brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; }
.hc-card .hc-brand .mini { width:30px; height:30px; border-radius:10px; background:#fff; color:var(--purple); display:grid; place-items:center; font-size:15px; }
.hc-card .hc-body { display:flex; gap:14px; padding:16px 18px; align-items:center; }
.hc-card .hc-avatar { width:74px; height:74px; border-radius:20px; background:#fff; color:var(--purple); display:grid; place-items:center; font-size:30px; font-weight:700; flex-shrink:0; }
.hc-card .hc-info b { font-size:17px; display:block; }
.hc-card .hc-info .u { font-size:11px; opacity:.8; letter-spacing:.5px; }
.hc-card .hc-rows { padding:0 18px 14px; display:grid; gap:6px; }
.hc-card .hc-row { display:flex; justify-content:space-between; border-bottom:1px dashed rgba(255,255,255,.25); padding:4px 0; }
.hc-card .hc-row span:first-child { opacity:.75; }
.hc-card .hc-qr { display:flex; justify-content:center; padding:6px 0 16px; }
.hc-card .hc-qr .qr { background:#fff; }
.hc-card .hc-foot { display:flex; justify-content:space-between; font-size:10.5px; opacity:.85; padding:10px 18px 14px; border-top:1px solid rgba(255,255,255,.2); }

/* ===== إطار الهاتف ===== */
.phone-frame { width: 350px; margin:0 auto; background:#101020; border-radius:46px; padding:12px; box-shadow: var(--shadow); border:3px solid #26264A; }
.phone-screen { background:#fff; border-radius:36px; overflow:hidden; min-height:640px; display:flex; flex-direction:column; }
.phone-status { background:#101020; color:#fff; font-size:11px; padding:9px 20px; display:flex; justify-content:space-between; }
.phone-body { flex:1; padding:16px; background:linear-gradient(180deg,#F4F2FF,#fff); display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
.p-app-title { display:flex; align-items:center; justify-content:space-between; }

function qrCells(seedStr) {
  const n = 21;

  for (let i = 0; i < n; i++) { const row = []; for (let j = 0; j < n; j++) row.push(rnd() > 0.52 ? 1 : 0); cells.push(row); }

/* ============ 6. عناصر الواجهة ============ */
const UI = {
  toast(msg, type) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast toast-' + (type || '');
    const icon = type === 'error' ? '✕' : type === 'success' ? '✓' : type === 'warning' ? '⚠' : 'ⓘ';
    el.innerHTML = '<span>' + icon + '</span><span>' + esc(msg) + '</span>';
    box.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 4200);
  },
  open(html, size) {
    const host = document.getElementById('modals');
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = '<div class="modal ' + (size || '') + '">' + html + '</div>';
    ov.addEventListener('click', (e) => { if (e.target === ov) UI.close(ov); });
    host.appendChild(ov);
    document.body.style.overflow = 'hidden';
    const c = ov.querySelector('[data-close]');
    if (c) c.addEventListener('click', () => UI.close(ov));
    return ov;
  },
  close(ov) { if (ov) ov.remove(); else document.getElementById('modals').innerHTML = ''; document.body.style.overflow = ''; },
  head(title, icon) {
    return '<div class="modal-head"><span class="brand-logo" style="width:38px;height:38px;font-size:17px;border-radius:12px">' + (icon || '📋') + '</span><h3>' + esc(title) + '</h3><button class="icon-btn" data-close>✕</button></div>';
  },
  confirm(msg, onOk, okLabel, danger) {
    const ov = UI.open(
      UI.head('تأكيد', '⚠️') +
      '<div class="modal-body"><p style="font-size:15px">' + esc(msg) + '</p></div>' +
      '<div class="modal-foot"><button class="btn btn-line" data-close>إلغاء</button><button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" id="cf-ok">' + esc(okLabel || 'تأكيد') + '</button></div>',
      'modal-sm'
    );
    ov.querySelector('#cf-ok').addEventListener('click', () => { UI.close(ov); onOk(); });
  },
  statusBadge(index) {
    const map = {
      green: '<span class="badge badge-green"><span class="dot dot-green"></span> مستقر</span>',
      orange: '<span class="badge badge-orange"><span class="dot dot-orange"></span> يحتاج متابعة</span>',
      red: '<span class="badge badge-red"><span class="dot dot-red"></span> خطر</span>',
    };
    return map[index] || '<span class="badge badge-gray">' + esc(index) + '</span>';
  },
  catBadge(cat) {
    const map = { elderly: '<span class="chip">👴 مسن</span>', child: '<span class="chip chip-blue">👶 طفل</span>', chronic: '<span class="chip chip-orange">💊 مزمن</span>', disability: '<span class="chip chip-purple">♿ إعاقة</span>' };
    return map[cat] || '<span class="chip">' + esc(cat) + '</span>';
  },
  contactBtns(phone, opts) {
    const p = phone || '';
    return '<div class="flex gap-8 flex-wrap mt-12">' +
      '<a class="btn btn-line btn-sm" href="tel:' + esc(p) + '" target="_blank">☎ اتصال</a>' +
      (p ? '<a class="btn btn-success btn-sm" href="https://wa.me/' + esc(String(p).replace(/[^\d]/g, '')) + '" target="_blank">💬 WhatsApp</a>' : '') +
      (opts || '') + '</div>';
  },
  sparkline(vals, w, h) {
    if (!vals || !vals.length) return '<p class="small muted">لا بيانات بعد</p>';
    const max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    const span = (max - min) || 1;
    const pts = vals.map((v, i) => (i / (vals.length - 1)) * w + ',' + (h - 4 - ((v - min) / span) * (h - 14))).join(' ');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none"><polyline fill="none" stroke="#6C4EFF" stroke-width="2.5" stroke-linejoin="round" points="' + pts + '"/></svg>';
  },
  empty(icon, text) { return '<div class="empty-state"><div class="big">' + icon + '</div>' + esc(text) + '</div>'; },
};

/* ============ 8. الموجّه Router ============ */
const Router = {
  views: {},
  register(name, def) { this.views[name] = def; },
  go(name, param) {
    const v = this.views[name];
    if (!v) { this.go('home'); return; }
    Store.view = name;
    const user = Store.user;
    const isAuthView = ['home', 'login'].includes(name);
    if (!user && !isAuthView) { this.go('login'); return; }
    if (user && v.roles && !v.roles.includes(Store.role) && !isAuthView) { this.go(Store.defaultView()); return; }
    if (user && isAuthView) { this.go(Store.defaultView()); return; }
    this.paint(v, param);
  },
  async paint(v, param) {
    const app = document.getElementById('app');
    app.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'view-wrap';
    app.appendChild(wrap);
    try {
      const html = await v.render(param);
      wrap.innerHTML = html;
      if (v.bind) v.bind(wrap, param);
      if (Store.user) this.shellSync();
    } catch (e) {
      console.error('[view]', e);
      wrap.innerHTML = UI.empty('😔', 'حدث خطأ غير متوقع: ' + e.message);
    }
  },
  shellSync() {
    const topbar = document.getElementById('topbar');
    const side = document.getElementById('sidebar');
    const bottom = document.getElementById('bottom-nav');
    const sos = document.getElementById('sos-fab');
    if (topbar) {
      const conn = topbar.querySelector('#conn-pill');
      if (conn) conn.className = 'conn-pill ' + (Store.connected() ? 'conn-on' : 'conn-off');
      const un = topbar.querySelector('#bell-count');
      if (un) { un.textContent = Store.unread(); un.style.display = Store.unread() ? 'grid' : 'none'; }
    }
    if (side) {
      side.querySelectorAll('.nav-item').forEach((b) => b.classList.toggle('active', b.dataset.nav === Store.view));
    }
    if (bottom) {
      bottom.querySelectorAll('.bn-item').forEach((b) => b.classList.toggle('active', b.dataset.nav === Store.view));
    }
    if (sos) sos.style.display = 'grid';
  },
};

function renderSearchResults(box, q) {
  const host = document.getElementById('search-results');
  if (!q) { host.classList.remove('open'); host.innerHTML = ''; return; }
  const ql = q.toLowerCase();
  const res = DB.all('patients').filter(p =>
    p.name.toLowerCase().includes(ql) || p.uid.toLowerCase().includes(ql) || p.fileNo.toLowerCase().includes(ql)
  );
  if (!res.length) { host.classList.remove('open'); return; }
  host.innerHTML = res.map(p =>
    '<div class="sr-item" data-sid="' + p.id + '">' + avatarOf(p.name, p.avatar, 36) +
    '<div><b>' + esc(p.name) + '</b><div class="small muted">' + esc(p.uid) + ' • ' + esc(p.fileNo) + '</div></div>' +
    UI.statusBadge(p.index) + '</div>'
  ).join('');
  host.classList.add('open');
  host.querySelectorAll('[data-sid]').forEach((it) => it.addEventListener('click', () => {
    host.classList.remove('open');
    document.getElementById('search-inp').value = '';
    Store.selectedId = it.dataset.sid;
    Router.go('patients');
    Router.paint(Router.views['patients']);
  }));
}

  const bp = v.map(x => x.bpSys).slice(-10);
  const timeline = v.slice(-6).reverse().map(x =>
    '<div class="tl-item"><b>' + fmtDate(x.at) + '</b>' +

  const contact = (p.guardian || {}).phone || p.phone;
  const relPhone = (p.guardian || {}).phone || (Store.userById(p.familyId) || {}).phone || p.phone;
  UI.open(
    UI.head('الملف الصحي الموحد — ' + p.name, '📂') +

function openProtocol(prid) {

  const p = Store.patient(pr.patientId);
  const log = (pr.log || []).map(l => '<div class="tl-item"><b>' + esc(l.action) + '</b><span class="small muted">' + fmtDate(l.at) + ' — ' + esc(l.by) + '</span></div>').join('');
  const ov = UI.open(
    UI.head('البروتوكول الصحي — ' + (p ? p.name : ''), '📋') +
    '<div class="modal-body">' +
    '<div class="flex items-center justify-between flex-wrap gap-8 mb-16">' +
    '<div><b style="font-size:18px">' + esc(pr.name) + '</b><div class="small muted">' + esc(pr.type) + ' — الطبيب: ' + esc(pr.doctor) + '</div></div>' +
    '<span class="badge badge-green"><span class="dot dot-green"></span> نشط</span></div>' +
    '<div class="grid grid-2 gap-12 mb-16">' +
    '<div class="kv"><span>تاريخ البداية</span><b>' + fmtDay(pr.start) + '</b></div>' +
    '<div class="kv"><span>تاريخ المراجعة</span><b>' + fmtDay(pr.review) + '</b></div></div>' +
    '<div class="mb-16"><b class="small muted">الأدوية والجرعات</b><div class="list-chips mt-8">' + pr.meds.map(x => '<span class="chip">💊 ' + esc(x) + '</span>').join('') + '</div></div>' +
    '<div class="mb-16"><b class="small muted">المواعيد</b><div class="list-chips mt-8">' + pr.appointments.map(x => '<span class="chip chip-blue">📅 ' + esc(x) + '</span>').join('') + '</div></div>' +
    '<div class="mb-16"><b class="small muted">القياسات والتحاليل المطلوبة</b><div class="list-chips mt-8">' +
    pr.required.map(x => '<span class="chip chip-orange">📐 ' + esc(x) + '</span>').concat(pr.tests.map(x => '<span class="chip chip-purple">🧪 ' + esc(x) + '</span>')).join('') + '</div></div>' +
    '<div class="card" style="background:var(--purple-050)"><b class="small muted">التعليمات</b><p class="small mt-8">' + esc(pr.instructions) + '</p></div>' +
    '<div class="mt-16"><b class="small muted">سجل التعديلات</b><div class="timeline mt-8">' + log + '</div></div>' +
    '</div>' +
    '<div class="modal-foot">' +
    '<button class="btn btn-ghost" id="pr-archive">📦 أرشفة</button>' +
    '<button class="btn btn-ghost" id="pr-stop">⏹ إيقاف</button>' +
    '<button class="btn btn-soft" id="pr-edit">✏️ تعديل</button>' +
    '<button class="btn btn-primary" data-close>إغلاق</button></div>'
  );
  const addLog = (action) => { pr.log.push({ at: new Date().toISOString(), by: Store.user ? Store.user.name : 'نظام', action }); DB.save(); toast('تم تسجيل العملية', 'success'); };
  ov.querySelector('#pr-edit').addEventListener('click', () => { addLog('تعديل البروتوكول'); UI.toast('وضع التعديل — النسخة التجريبية', 'success'); });
  ov.querySelector('#pr-stop').addEventListener('click', () => { pr.status = 'stopped'; addLog('إيقاف البروتوكول'); });
  ov.querySelector('#pr-archive').addEventListener('click', () => { pr.status = 'archived'; addLog('أرشفة البروتوكول'); });
}

    if (tg) tg.addEventListener('click', () => {
      Store.offline = !Store.offline;
      if (!Store.offline) syncNow();
      else toast('📴 وضع دون اتصال — البيانات تُحفظ محلياً', 'warning');
      Router.paint(Router.views['nurse']);
    });
    const sv = el.querySelector('#nv-save');
    if (sv) sv.addEventListener('click', () => {
      const pid = el.querySelector('#nv-pat').value;
      const p = Store.patient(pid);
      const v = {
        id: uid(), patientId: pid,
        bpSys: parseInt(el.querySelector('#nv-sys').value, 10) || 0,
        bpDia: parseInt(el.querySelector('#nv-dia').value, 10) || 0,
        glucose: parseFloat(el.querySelector('#nv-glu').value) || 0,
        pulse: parseInt(el.querySelector('#nv-pulse').value, 10) || 0,
        spo2: parseInt(el.querySelector('#nv-spo2').value, 10) || 0,
        temp: parseFloat(el.querySelector('#nv-temp').value) || 0,
        weight: parseFloat(el.querySelector('#nv-weight').value) || 0,
        source: 'ممرض متنقل', by: Store.user.name, note: el.querySelector('#nv-note').value,
        at: new Date().toISOString(), synced: !Store.offline,
      };
      DB.insert('vitals', v);
      const glucose = v.glucose || 0;
      let idx = 'green';
      if (v.bpSys >= 160 || glucose >= 1.8 || v.spo2 <= 92) idx = 'red';
      else if (v.bpSys >= 140 || glucose >= 1.4 || v.spo2 <= 95) idx = 'orange';
      p.index = idx; p.lastVisit = v.at;
      if (idx === 'red') {
        DB.insert('alerts', { id: uid(), type: 'critical', icon: '🔴', title: 'تغير مهم في مؤشر صحي', message: 'سجل ' + p.name + ' قياسات حرجة (ضغط ' + v.bpSys + '/' + v.bpDia + '، سكر ' + v.glucose + '، SpO2 ' + v.spo2 + '%).', patientId: pid, at: v.at, read: false });
      }
      DB.save();
      toast(idx === 'red' ? '🚨 قياسات حرجة — تم إخطار الطبيب والعائلة' : (Store.offline ? '💾 حفظت محلياً — ستُزامن لاحقاً' : '✅ تم تسجيل الزيارة'), idx === 'red' ? 'warning' : 'success');
      Router.paint(Router.views['nurse']);
    });
  },
});
function recentVisits() {
  const rows = DB.all('vitals').slice().sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 6).map(v => {

      else if (k === 'meds') { toast('💊 جدول الأدوية معروض بالأسفل', 'success'); }

      const p = Store.role === 'patient' ? Store.patient(Store.user.id) : Store.patients[0];
      const v = {
        id: uid(), patientId: p.id,
        bpSys: parseInt(el.querySelector('#mg-sys').value, 10) || 0,
        bpDia: parseInt(el.querySelector('#mg-dia').value, 10) || 0,
        glucose: parseFloat(el.querySelector('#mg-glu').value) || 0,
        pulse: 0, temp: 0, spo2: 0, weight: 0,
        source: 'منزل المستفيد', by: p.name, note: '',
        at: new Date().toISOString(), synced: Store.connected(),
      };
      DB.insert('vitals', v);
      let idx = 'green';
      if (v.bpSys >= 160 || v.glucose >= 1.8) idx = 'red';
      else if (v.bpSys >= 140 || v.glucose >= 1.4) idx = 'orange';
      p.index = idx; p.lastVisit = v.at;

      toast(idx === 'red' ? '🚨 قياس حرج — تم إخطار الطبيب والعائلة' : '✅ تم حفظ القياس', idx === 'red' ? 'warning' : 'success');
      Router.paint(Router.views['mobile']);
    });
  },
});

function addToTrip(pid, pkid) {
  const p = Store.patient(pid);
  const pk = DB.find('packages', x => x.id === pkid);
  if (!p || !pk) return;
  const n = DB.all('trips').length + 1;
  DB.insert('trips', {
    id: uid(), number: 'TP-2026-' + String(n).padStart(3, '0'), patientId: pid, packageId: pkid,
    beneficiary: p.name, status: 'confirmed',
    start: new Date().toISOString(), end: new Date(Date.now() + 7 * 864e5).toISOString(),
    hotel: 'فندق الوجهة', institution: 'مؤسسة صحية شريكة', doctor: Store.personName(p.doctorId), nurse: 'الممرضة سارة بلقاسم',
    guide: 'المرشد إبراهيم بوزيد', agency: 'وكالة صحراء فيتا', transport: 'نقل مكيف خاص',
    services: ['جلسات علاجية', 'إقامة', 'مرافقة طبية'],
    needs: { health: 'متابعة حسب البروتوكول', special: 'تسهيلات الحركة', transport: 'نقل مكيف' },
  });
  p.tourismId = pkid;
  DB.save();
  UI.close(document.getElementById('modals').lastChild);
  UI.toast('➕ تمت إضافة المستفيد إلى البرنامج السياحي — أنشئ ملف الرحلة وتم ربط الجهات', 'success');
  Router.paint(Router.views['tourism']);
}
function registerToProgram() {
  const opts = DB.all('patients').map(p => '<option value="' + p.id + '">' + esc(p.name) + '</option>').join('');
  const pks = DB.all('packages').map(x => '<option value="' + x.id + '">' + esc(x.name) + ' — ' + esc(x.destination) + '</option>').join('');

      '<span class="chip" style="background:var(--purple-100);color:var(--purple-600)">' + (i + 1) + '. ' + s + '</span>').join('') + '</div>' +
    '<div class="form-group"><label>المستفيد</label><select class="form-control" id="tp-pat">' + opts + '</select></div>' +

    '<div class="form-group"><label>احتياجات خاصة</label><input class="form-control" id="tp-need" placeholder="مثال: عكازة، كرسي متحرك..."></div>' +
    '<div class="form-group"><label>مدة الإقامة (أيام)</label><input class="form-control" id="tp-days" value="7"></div>' +
